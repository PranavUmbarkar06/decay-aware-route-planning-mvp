# Main application config. Validated by backend/app/core/config.py (unknown keys fail fast).
product_name: "Impact Tank Post-Harvest Platform (working title)"
logo_path: "/logo-placeholder.svg"
version: "0.1.0"

runtime:
  demo_mode: true            # shows DEMO banners, seed-reset button, DEV AUTH
  database_url: "sqlite:///./data/cache/phl_demo.sqlite"
  timezone_display: "Asia/Kolkata"   # storage is always UTC
  cors_origins: ["http://localhost:5173", "http://localhost:8000"]

auth:
  mode: "dev_stub"           # dev_stub | provider (provider adapter not implemented; see INTEGRATIONS_TODO)
  otp_ttl_s: 300
  otp_max_attempts: 5
  jwt_ttl_s: 3600
  jwt_secret_env: "PHL_JWT_SECRET"   # read from env; dev fallback is generated per process and logged as DEV

pin:                         # see docs/SECURITY.md
  digits: 4
  max_failures: 5
  lockout_s: 900
  ttl_h: 72
  rate_limit_per_min: 10

handover:
  weight_tolerance_pct: 2.0  # ASSUMPTION: beyond this, status DISPUTED_WEIGHT (needs validation)

wastage:
  undo_window_s: 120

rescue:
  claim_timer_s: 7200        # 2 h, per the feature spec
  offer_ttl_s: 1800          # how long an unclaimed broadcast stays with one NGO before cascading
  safety_margin_frac: 0.5    # ASSUMPTION: show only 50% of model remaining life as the "safe window"
  max_road_time_h: 3.0

matching:
  weights: {road_time: 0.4, life_margin: 0.4, capacity_fit: 0.2}   # ASSUMPTION

crowd_meter:
  trailing_days: 14
  warn_ratio: 1.3            # ASSUMPTION: arrivals > 1.3 × trailing median → "glut warning"
  stale_after_days: 3
  alternate_radius_h: 3.0

map:
  tile_url: "https://tile.openstreetmap.org/{z}/{x}/{y}.png"   # dev/demo only (ADR-006)
  attribution: "© OpenStreetMap contributors"

features:
  ml_surrogate: false
  push_notifications: true

units:
  internal: "kg"
  display_options: ["kg", "quintal", "tonne"]
